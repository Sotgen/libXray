name: Build xray.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
        id: ndk

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      # --- GANTI: pakai script build RESMI libXray, bukan `gomobile bind` manual ---
      # Script ini yang menentukan & mengunci versi Xray-core yang sudah teruji
      # kompatibel dengan kode wrapper di repo ini (dibaca dari
      # build/app/build.py -> DEFAULT_XRAY_CORE_TAG), jadi TIDAK akan
      # menghasilkan mismatch seperti "package .../common/geodata tidak
      # ditemukan" yang terjadi waktu kita coba `go get -u @latest` manual.
      #
      # Kalau step ini gagal dengan "No such file or directory: build/main.py",
      # itu tandanya fork ini belum di-sync dengan upstream XTLS/libXray --
      # sync fork dulu (tombol "Sync fork" di GitHub, atau
      # `git fetch upstream && git merge upstream/main`) sebelum run ulang.
      - name: Build AAR (script resmi libXray)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          python3 build/main.py android

      - name: Upload xray.aar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-aar
          path: |
            **/xray.aar
            **/xray-sources.jar
