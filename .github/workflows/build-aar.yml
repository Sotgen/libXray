name: Build xray.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # --- BARU: naikkan versi xray-core ke rilis resmi terbaru SEBELUM build ---
      # Tanpa langkah ini, go.mod/go.sum yang sudah ter-commit di repo dipakai
      # apa adanya -> hasil build selalu versi yang sama walau workflow di-run
      # ulang berkali-kali (ini penyebab xray.aar kamu masih v26.3.27 terus).
      - name: Update xray-core dependency to latest
        run: |
          go get -u github.com/xtls/xray-core@latest
          go mod tidy

      - name: Install gomobile
        run: |
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build AAR
        run: |
          gomobile bind -v -androidapi 21 -ldflags="-s -w -checklinkname=0" -target=android -o xray.aar .

      # --- BARU: commit balik go.mod/go.sum yang sudah naik versi, biar next
      # build (atau siapa pun yang baca repo) tahu versi xray-core yang dipakai
      # bukan cuma "nempel" di satu run doang.
      - name: Commit updated go.mod/go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet && echo "Tidak ada perubahan dependency" || git commit -m "chore: bump xray-core dependency"
          git push

      - name: Upload xray.aar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-aar
          path: |
            xray.aar
            xray-sources.jar
