name: Build xray.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Update dependencies & Install gomobile
        run: |
          go get -u github.com/wlynxg/anet@latest
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build AAR
        run: |
          gomobile bind -v -androidapi 21 -ldflags="-s -w" -target=android -o xray.aar .

      - name: Upload xray.aar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-aar
          path: |
            xray.aar
            xray-sources.jar
