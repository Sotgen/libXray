name: Build xray.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
        id: ndk

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build AAR (script resmi libXray)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          python3 build/main.py android

      - name: Rename output to xray.aar
        run: |
          # Cari file .aar hasil build LibXray lalu samakan namanya menjadi xray.aar
          AAR_FILE=$(find . -maxdepth 3 -type f -iname "*libxray*.aar" -o -maxdepth 3 -type f -name "*.aar" | head -n 1)
          if [ -n "$AAR_FILE" ]; then
            echo "Ditemukan file: $AAR_FILE"
            cp "$AAR_FILE" xray.aar
          else
            echo "File AAR tidak ditemukan!"
            ls -la
            exit 1
          fi

      - name: Upload xray.aar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-aar
          path: xray.aar
